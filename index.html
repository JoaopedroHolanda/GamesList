<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameList</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #1a1f36;
      --border: #2c3354;
      --text: #e8ebf7;
      --muted: #9aa3c7;
      --accent: #7c5cff;
      --accent-hover: #6a49f0;
      --danger: #ff6b81;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(1200px 600px at 50% -10%, #1d2350 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 420px; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { margin: 0; font-size: 2rem; letter-spacing: .02em; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 6px 0 0; color: var(--muted); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    label { display: block; margin-bottom: 14px; font-size: .9rem; color: var(--muted); }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12162b;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: wait; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 16px; }
    .error { min-height: 1.3em; margin: 0 0 12px; color: var(--danger); font-size: .9rem; }
    .welcome h2 { margin: 0 0 8px; }
    .welcome p { color: var(--muted); line-height: 1.5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>Game<span>List</span></h1>
      <p>Sua lista de jogos, num só lugar.</p>
    </header>

    <section id="login-view" class="card" aria-labelledby="login-title">
      <h2 id="login-title" style="margin-top:0">Entrar</h2>
      <form id="login-form" novalidate>
        <label>Usuário
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label>Senha
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" role="alert" aria-live="polite"></p>
        <button id="login-button" type="submit">Entrar</button>
      </form>
    </section>

    <section id="home-view" class="card welcome" aria-labelledby="home-title" hidden>
      <h2 id="home-title">Bem-vindo, <span id="home-user"></span>!</h2>
      <p>Login realizado com sucesso. Em breve, aqui ficará a sua lista de jogos.</p>
      <button id="logout-button" type="button" class="secondary">Sair</button>
    </section>
  </main>

  <script>
    const API = "/api/web";
    const TOKEN_KEY = "gamelist.token";

    const loginView = document.getElementById("login-view");
    const homeView = document.getElementById("home-view");
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const loginButton = document.getElementById("login-button");

    function getToken() {
      try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; }
    }
    function setToken(token) {
      try {
        if (token) sessionStorage.setItem(TOKEN_KEY, token);
        else sessionStorage.removeItem(TOKEN_KEY);
      } catch { /* armazenamento indisponível: a sessão vale só até recarregar */ }
    }

    function showLogin() {
      homeView.hidden = true;
      loginView.hidden = false;
      document.getElementById("username").focus();
    }
    function showHome(user) {
      document.getElementById("home-user").textContent = user;
      loginView.hidden = true;
      homeView.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) {
        errorBox.textContent = "Informe usuário e senha.";
        return;
      }
      loginButton.disabled = true;
      try {
        const response = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (response.status === 401) {
          errorBox.textContent = "Usuário ou senha inválidos.";
          return;
        }
        if (!response.ok) {
          errorBox.textContent = "Não foi possível entrar agora. Tente novamente.";
          return;
        }
        const data = await response.json();
        setToken(data.token);
        form.reset();
        showHome(data.user);
      } catch {
        errorBox.textContent = "Sem conexão com a API.";
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("logout-button").addEventListener("click", () => {
      setToken(null);
      showLogin();
    });

    // Ao abrir a página, reaproveita a sessão se o token ainda for válido.
    (async function restoreSession() {
      const token = getToken();
      if (!token) return showLogin();
      try {
        const response = await fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) throw new Error("sessão inválida");
        const data = await response.json();
        showHome(data.user);
      } catch {
        setToken(null);
        showLogin();
      }
    })();
  </script>
</body>
</html>
